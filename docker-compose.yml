services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentvault
      POSTGRES_PASSWORD: agentvault
      POSTGRES_DB: agentvault
    ports:
      - "5432:5432"
    volumes:
      - agentvault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://agentvault:agentvault@db:5432/agentvault
      ENVIRONMENT: development
      X402_FACILITATOR_URL: https://x402.org/facilitator
      MOCK_PROVIDER_PAY_TO: ${MOCK_PROVIDER_PAY_TO:-YOUR_ALGORAND_TESTNET_RECEIVE_ADDRESS}
    ports:
      - "8000:8000"

volumes:
  agentvault_pgdata:
